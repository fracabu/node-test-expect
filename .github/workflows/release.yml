name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Update npm (npm stage needs v12+)
        run: npm install -g npm@12

      # Trusted publishing (OIDC via id-token: write), no NPM_TOKEN needed.
      # The release is staged: it goes public only after a 2FA approval on npmjs.com
      - name: Stage publish to npm
        run: npm stage publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
